<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>GPT 账号切换</title>
    <link rel="stylesheet" href="popup.css">
    <style>
        .svg-icon {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>

<body>

    <header>
        <div class="brand">
            <img src="icons/Logo.png" width="20" height="20" alt="Logo">
            <span>GPT Switcher</span>
        </div>
        <div class="header-actions">
            <!-- Login / Logout Link -->
            <button id="loginLinkBtn" title="去登录页">
                <svg class="svg-icon" viewBox="0 0 24 24">
                    <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
                    <polyline points="10 17 15 12 10 7" />
                    <line x1="15" y1="12" x2="3" y2="12" />
                </svg>
            </button>
            <!-- Theme Toggle -->
            <button id="themeBtn" title="切换主题">
                <svg class="svg-icon" viewBox="0 0 24 24">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
            <!-- Settings / Tools Toggle -->
            <button id="toolsToggle" title="工具">
                <svg class="svg-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="1"></circle>
                    <circle cx="19" cy="12" r="1"></circle>
                    <circle cx="5" cy="12" r="1"></circle>
                </svg>
            </button>
            <!-- Tools Dropdown -->
            <div class="tools-dropdown" id="toolsMenu">
                <div class="tools-section">
                    <div class="tools-section-label">Auto Import</div>
                    <div class="segmented-control" id="autoImportModeGroup" role="tablist" aria-label="Auto import mode">
                        <button type="button" class="segment-btn" data-mode="off">Off</button>
                        <button type="button" class="segment-btn" data-mode="switch">Switch</button>
                        <button type="button" class="segment-btn" data-mode="all">All</button>
                    </div>
                </div>
                <div class="tools-divider"></div>
                <button class="tools-item" id="exportBtn">📤 导出配置</button>
                <button class="tools-item" id="importBtn">📥 导入配置</button>
                <div class="tools-divider"></div>
                <button class="tools-item" id="clearAllBtn" style="color: red;">⚠️ 清空数据</button>
            </div>
        </div>
    </header>

    <!-- 工具栏区域（固定不滚动） -->
    <section class="section-header">
        <div class="toolbar">
            <div class="search-container">
                <span class="search-icon">
                    <svg class="svg-icon" style="width:14px;height:14px;" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </span>
                <input type="text" id="searchBox" class="search-input" placeholder="搜索账号...">
            </div>
            <button id="syncCurrentBtn" class="toolbar-btn" title="更新当前账号信息">
                <svg class="svg-icon" viewBox="0 0 24 24">
                    <polyline points="1 4 1 10 7 10"></polyline>
                    <polyline points="23 20 23 14 17 14"></polyline>
                    <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10M23 14l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
                </svg>
            </button>
            <button id="tagsManageBtn" class="toolbar-btn" title="标签管理">
                <svg class="svg-icon" viewBox="0 0 24 24">
                    <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
                    <line x1="7" y1="7" x2="7.01" y2="7"></line>
                </svg>
            </button>
            <button id="toggleAddBtn" class="add-btn-main" title="添加新账号">+</button>
        </div>

        <!-- 标签筛选栏 -->
        <div id="tagFilterBar" class="tag-filter-bar">
            <!-- 由 JS 动态渲染 -->
        </div>
    </section>

    <main>
        <div id="modalOverlay" class="modal-overlay"></div>

        <div id="editForm" class="modal-form">
            <h3 id="modalTitle">添加账号</h3>
            <div class="form-row">
                <input type="text" id="inputEmail" class="form-input" placeholder="Email / 备注名" autocomplete="off">
            </div>
            <div class="form-row">
                <input type="text" id="inputToken" class="form-input" placeholder="Session Token" autocomplete="off">
                <button id="grabBtn" class="btn btn-grab" title="自动获取当前 Token">
                    <svg class="svg-icon" viewBox="0 0 24 24">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                </button>
            </div>
            <div class="form-row tag-selector-row">
                <label>选择标签:</label>
                <div id="tagSelector" class="tag-selector">
                    <!-- Tags will be injected by JS -->
                </div>
            </div>
            <div class="form-actions">
                <button id="cancelEditBtn" class="btn btn-secondary">取消</button>
                <button id="saveBtn" class="btn btn-primary">保存</button>
            </div>
        </div>

        <!-- 标签管理弹窗 -->
        <div id="tagManagerModal" class="modal-form tag-manager-modal">
            <h3>标签管理</h3>
            <div id="tagList" class="tag-list">
                <!-- Tags will be injected by JS -->
            </div>
            <div class="tag-add-section">
                <input type="text" id="newTagName" class="form-input" placeholder="新标签名称" autocomplete="off">
                <div id="colorPicker" class="color-picker">
                    <span class="color-option" data-color="#22c55e" style="background:#22c55e"></span>
                    <span class="color-option" data-color="#3b82f6" style="background:#3b82f6"></span>
                    <span class="color-option" data-color="#eab308" style="background:#eab308"></span>
                    <span class="color-option" data-color="#a855f7" style="background:#a855f7"></span>
                    <span class="color-option" data-color="#ef4444" style="background:#ef4444"></span>
                    <span class="color-option" data-color="#06b6d4" style="background:#06b6d4"></span>
                    <span class="color-option" data-color="#ec4899" style="background:#ec4899"></span>
                    <span class="color-option selected" data-color="#6b7280" style="background:#6b7280"></span>
                </div>
                <button id="addTagBtn" class="btn btn-primary">添加</button>
            </div>
            <div class="form-actions">
                <button id="closeTagManagerBtn" class="btn btn-secondary">关闭</button>
            </div>
        </div>

        <!-- 标签编辑弹窗遮罩 -->
        <div id="tagEditOverlay" class="tag-edit-overlay"></div>

        <!-- 标签编辑弹窗 -->
        <div id="tagEditModal" class="modal-form tag-edit-modal">
            <h3>编辑标签</h3>
            <div class="form-row">
                <input type="text" id="editTagName" class="form-input" placeholder="标签名称" autocomplete="off">
            </div>
            <div class="form-row">
                <label style="font-size:12px;color:var(--text-sub);margin-bottom:6px;">选择颜色:</label>
                <div id="editColorPicker" class="color-picker">
                    <span class="color-option" data-color="#22c55e" style="background:#22c55e"></span>
                    <span class="color-option" data-color="#3b82f6" style="background:#3b82f6"></span>
                    <span class="color-option" data-color="#eab308" style="background:#eab308"></span>
                    <span class="color-option" data-color="#a855f7" style="background:#a855f7"></span>
                    <span class="color-option" data-color="#ef4444" style="background:#ef4444"></span>
                    <span class="color-option" data-color="#06b6d4" style="background:#06b6d4"></span>
                    <span class="color-option" data-color="#ec4899" style="background:#ec4899"></span>
                    <span class="color-option" data-color="#6b7280" style="background:#6b7280"></span>
                </div>
            </div>
            <div class="form-actions">
                <button id="cancelEditTagBtn" class="btn btn-secondary">取消</button>
                <button id="saveEditTagBtn" class="btn btn-primary">保存</button>
            </div>
        </div>

        <ul id="accountList">
            <!-- List items injected by JS -->
        </ul>
    </main>

    <input type="file" id="fileInput" accept=".json,.txt" style="display: none;">

    <!-- 删除确认弹窗 -->
    <div id="deleteModal" class="delete-modal">
        <div class="delete-modal-content">
            <div class="delete-icon">🗑️</div>
            <h3>确认删除</h3>
            <p id="deleteMessage">确定要删除该账号吗？此操作不可撤销。</p>
            <div class="delete-actions">
                <button id="cancelDeleteBtn" class="btn btn-secondary">取消</button>
                <button id="confirmDeleteBtn" class="btn btn-danger">删除</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="Sortable.min.js"></script>
    <script src="popup/mock-chrome.js"></script>
    <script type="module" src="popup/main.js"></script>
</body>

</html>
